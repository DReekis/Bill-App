version: 1.0
runtime: nodejs20
build:
  commands:
    pre-build:
      - node scripts/prepare-db.js postgresql
    build:
      - npm ci
      - npx prisma generate
      - npm run build
run:
  command: ./docker-entrypoint.sh
  network:
    port: 4000
    env: PORT
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "4000"
