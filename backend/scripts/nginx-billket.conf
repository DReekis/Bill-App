# ==============================================================================
# Nginx Reverse Proxy Configuration for Billket Cloud
# File location on host: /etc/nginx/sites-available/billket.conf
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN_OR_IP; # Replace with your domain name (e.g. api.billket.in) or EC2 public DNS

    # Maximum file upload size (required for database backup uploads)
    client_max_body_size 50M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy to Fastify API running in Docker on 127.0.0.1:4000
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Logging
    access_log /var/log/nginx/billket_access.log;
    error_log /var/log/nginx/billket_error.log;
}
