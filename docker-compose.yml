version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: billket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: billket_user
      POSTGRES_PASSWORD: billket_secure_password_2026
      POSTGRES_DB: billket_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billket_user -d billket_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: billket-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://billket_user:billket_secure_password_2026@postgres:5432/billket_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-billket_jwt_secret_production_ready_secure_2026}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@pricepilot.in}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-1088562819881-tesapmissm77nd7o5maom90nh4sjv87h.apps.googleusercontent.com}
      GOOGLE_ANDROID_CLIENT_ID: ${GOOGLE_ANDROID_CLIENT_ID:-1088562819881-rv6kpg40eqnlsaqp196g5ligiqeujunr.apps.googleusercontent.com}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_TlVBcJ5F1D187V}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-wEQAJKA0T1iJNITsDV9jRRI3}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-wEQAJKA0T1iJNITsDV9jRRI3}
      TWOFACTOR_API_KEY: ${TWOFACTOR_API_KEY:-26423af7-c270-11f1-af74-0200cd936042}
      TWOFACTOR_BASE_URL: ${TWOFACTOR_BASE_URL:-https://2factor.in/API/V1}
      SANDBOX_API_KEY: ${SANDBOX_API_KEY:-key_live_6000130d928043638b3d70dd31d79f6c}
      SANDBOX_API_SECRET: ${SANDBOX_API_SECRET:-secret_live_a36390af553441d5907967ddb7c14ad8}
      SANDBOX_BASE_URL: ${SANDBOX_BASE_URL:-https://api.sandbox.co.in}
    ports:
      - "127.0.0.1:4000:4000"

volumes:
  postgres_data:
    driver: local
