version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: billket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: billket_user
      POSTGRES_PASSWORD: billket_secure_password_2026
      POSTGRES_DB: billket_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billket_user -d billket_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: billket-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://billket_user:billket_secure_password_2026@postgres:5432/billket_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_ANDROID_CLIENT_ID: ${GOOGLE_ANDROID_CLIENT_ID:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      TWOFACTOR_API_KEY: ${TWOFACTOR_API_KEY:-}
      TWOFACTOR_BASE_URL: ${TWOFACTOR_BASE_URL:-https://2factor.in/API/V1}
      SANDBOX_API_KEY: ${SANDBOX_API_KEY:-}
      SANDBOX_API_SECRET: ${SANDBOX_API_SECRET:-}
      SANDBOX_BASE_URL: ${SANDBOX_BASE_URL:-https://api.sandbox.co.in}
    ports:
      - "127.0.0.1:4000:4000"

volumes:
  postgres_data:
    driver: local
